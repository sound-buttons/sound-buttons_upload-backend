services:
  soundbuttons:
    build:
      context: .
      target: final
      args:
        - BUILD_CONFIGURATION=Release
      # cache_from:
      #   - ghcr.io/sound-buttons/backend:cache
      # cache_to:
      #   - type=inline
    ports:
      - 7071:8080
    env_file:
      - path: .env
        required: false
    environment:
      # This connect to the azure storage emulator
      # https://learn.microsoft.com/zh-tw/azure/storage/common/storage-use-azurite#well-known-storage-account-and-key
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-emulator:10000/devstoreaccount1;QueueEndpoint=http://azurite-emulator:10001/devstoreaccount1;TableEndpoint=http://azurite-emulator:10002/devstoreaccount1;
      # #
      - AzureFunctionsJobHost__Logging__Console__IsEnabled=true
      - AzureFunctionsJobHost__Logging__LogLevel__Default=Debug
      # The Blob client (audio/JSON upload) reads AzureStorage (not AzureWebJobsStorage).
      # Point it at Azurite for local end-to-end upload testing; override with a real
      # connection string via .env for non-local use.
      - AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-emulator:10000/devstoreaccount1;QueueEndpoint=http://azurite-emulator:10001/devstoreaccount1;TableEndpoint=http://azurite-emulator:10002/devstoreaccount1;
      # #
      # - Seq_ServerUrl=
      # - Seq_ApiKey=
      # - AzureStorage=
      # - OpenAI_ApiKey=

  # Azure Storage Emulator, needed for the durable functions
  # You can use your online azure storage account instead and make sure to set the AzureWebJobsStorage env variable to the online connection string
  azurite-emulator:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: the upgraded Azure.Storage.Blobs SDK negotiates a newer
    # Storage REST API version than Azurite currently validates; this flag is required
    # for local development only and has no effect on real Azure Storage.
    command: "azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
